# This is a standard configuration for single datatabase
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/demo
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: a1234
    # HikariCP Connection Pool Configuration
    hikari:
      maximum-pool-size: 3
      minimum-idle: 2
      connection-timeout: 30000
      auto-commit: true

  # Spring SQL Initialization
  sql:
    init:
      mode: always